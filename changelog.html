<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👂</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earprint — Changelog</title>
<meta name="description" content="What changed in Earprint, newest first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3F4F9;--surface:#FFFFFF;--raised:#EEF0F7;--line:#D9DCEA;--ink:#14142B;--muted:#4E5670;--cta:#15803D;--on-cta:#FFFFFF;--accent:#C92A63;--accent-2:#1D6A94;--low:#7F88AE;--danger:#B3261E;--ring:#1D6A94;
--f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"Fira Code",ui-monospace,"SF Mono",Menlo,monospace;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0F23;--surface:#1B1B30;--raised:#24243C;--line:#34345A;--ink:#F8FAFC;--muted:#A9B3C7;--cta:#22C55E;--on-cta:#0B1A10;--accent:#FF6B9C;--accent-2:#5BB4E0;--low:#6B6BA6;--danger:#FF8A80;--ring:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0F23;--surface:#1B1B30;--raised:#24243C;--line:#34345A;--ink:#F8FAFC;--muted:#A9B3C7;--cta:#22C55E;--on-cta:#0B1A10;--accent:#FF6B9C;--accent-2:#5BB4E0;--low:#6B6BA6;--danger:#FF8A80;--ring:#FFFFFF;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
main{max-width:calc(760px + 2*max(16px,env(safe-area-inset-left),env(safe-area-inset-right)));margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(60px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 24px}
.brand svg{width:28px;height:28px;flex:0 0 auto;color:var(--ink)}
.brand a{font:700 20px/1.2 var(--f-body);letter-spacing:-.01em;color:var(--ink);text-decoration:none;border-radius:4px}
.brand a:hover{text-decoration:underline}
h1{font:700 clamp(28px,4vw,40px)/1.1 var(--f-body);margin:0 0 8px;letter-spacing:-.02em}
h2{font:600 20px/1.3 var(--f-body);margin:32px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
a{color:var(--accent-2);text-decoration:underline;text-underline-offset:2px;border-radius:2px}
a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
b,strong{font-weight:600}
code{font:400 14px var(--f-mono);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:0 0 20px;font-size:16px;max-width:70ch}
.ver{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.ver .v{font:600 20px/1.3 var(--f-body)}
.ver time{color:var(--muted);font:400 14px var(--f-mono)}
.ver .cur{font:600 13px var(--f-body);background:var(--raised);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
section>p{margin:0 0 10px;max-width:75ch}
ul{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px}
p,li{text-wrap:pretty}
li>span:last-child{min-width:0;max-width:75ch}
li ul{margin:6px 0 0}
li li{display:list-item;list-style:disc;margin:0 0 4px 18px}
.tag{flex:0 0 auto;min-width:78px;text-align:center;font:600 13px/1.4 var(--f-body);border-radius:6px;padding:2px 8px;margin-top:2px;border:1px solid var(--line);background:none;color:var(--muted)}
.tag.new{color:var(--accent-2);border-color:var(--accent-2)}
.tag.chg{color:var(--muted);border-color:var(--line)}
.tag.fix{color:var(--accent);border-color:var(--accent)}
.back{margin:32px 0 0}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
@media (max-width:420px){li{flex-direction:column;gap:4px}.tag{min-width:0}}
</style>
</head>
<body>
<main>
<header>
<p class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 17a11 11 0 0 1 22 0"/><path d="M9 18a7 7 0 0 1 14 0c0 4-3 5-3 8"/><path d="M13.5 18.5a2.5 2.5 0 0 1 5 0c0 2-1.5 2.5-1.5 5" style="stroke:var(--accent)"/></svg><a href="./">Earprint</a></p>
<h1>Changelog</h1>
<p class="sub"><span id="intro">What changed in Earprint, newest first.</span> <a href="./">Back to the app</a></p>
</header>
<div id="log"><p class="msg">Loading…</p></div>
<p class="back"><a href="./">Back to Earprint</a></p>
</main>
<script>
// Renders CHANGELOG.md (the single source of truth) next to this page.
(function () {
  const log = document.getElementById("log");
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const TAGS = { added: ["new", "New"], changed: ["chg", "Changed"], fixed: ["fix", "Fixed"], removed: ["chg", "Removed"] };
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  // Inline markdown on already-escaped text: `code`, **bold**, *italic*, [text](url).
  function inline(s) {
    const codes = [];
    s = esc(s).replace(/`([^`]+)`/g, (_, c) => (codes.push(c), "\u0000" + (codes.length - 1) + "\u0000"));
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
         .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
           /^(https?:\/\/|\.?\/|#|[\w.-]+(\.\w+)?$)/.test(u) ? `<a href="${u}">${t}</a>` : t)
         .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  }
  function niceDate(d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    return m ? `${MON[+m[2] - 1]} ${+m[3]}, ${m[1]}` : d;
  }
  function render(md) {
    const out = [], intro = [];
    let sec = null, tag = null, item = null, sub = null;
    const close = () => { item = null; sub = null; };
    for (const raw of md.replace(/\r/g, "").split("\n")) {
      const line = raw.trimEnd();
      let m;
      if (/^#\s/.test(line)) continue;
      if ((m = /^##\s+(.*)$/.exec(line))) {
        close(); tag = null;
        const [, date, title] = /^(\d{4}-\d{2}-\d{2})?\s*(?:[—–-]\s*)?(.*)$/.exec(m[1]);
        sec = { date: date || "", title: title || "", body: [] };
        out.push(sec); continue;
      }
      if (!sec) { if (line) intro.push(line); continue; }
      if ((m = /^###\s+(.*)$/.exec(line))) {
        close();
        const k = m[1].trim().toLowerCase();
        tag = TAGS[k] || ["chg", m[1].trim()];
        continue;
      }
      if ((m = /^- (.*)$/.exec(line))) {
        item = { tag, text: m[1], subs: [] }; sub = null;
        sec.body.push(item); continue;
      }
      if (item && (m = /^\s{2,}- (.*)$/.exec(line))) { sub = { text: m[1] }; item.subs.push(sub); continue; }
      if (item && /^\s{2,}\S/.test(line)) { (sub || item).text += " " + line.trim(); continue; }
      if (!line) { close(); continue; }
      sec.body.push({ para: line });
    }
    if (!out.length) throw new Error("No entries found");
    let html = "";
    out.forEach((s, i) => {
      const id = (s.date || "entry") + (out.slice(0, i).some(o => o.date === s.date) ? "-" + i : "");
      html += `<section><h2 id="${esc(id)}"><span class="ver"><span class="v">${inline(s.title || niceDate(s.date))}</span>`;
      if (s.title && s.date) html += `<time datetime="${esc(s.date)}">${esc(niceDate(s.date))}</time>`;
      if (i === 0) html += `<span class="cur">Latest</span>`;
      html += `</span></h2>`;
      let open = false;
      for (const b of s.body) {
        if (b.para) { if (open) { html += "</ul>"; open = false; } html += `<p>${inline(b.para)}</p>`; continue; }
        if (!open) { html += "<ul>"; open = true; }
        const [cls, label] = b.tag || ["chg", "Note"];
        html += `<li><span class="tag ${cls}">${esc(label)}</span><span>${inline(b.text)}`;
        if (b.subs.length) html += "<ul>" + b.subs.map(x => `<li>${inline(x.text)}</li>`).join("") + "</ul>";
        html += "</span></li>";
      }
      if (open) html += "</ul>";
      html += "</section>";
    });
    if (intro.length) document.getElementById("intro").innerHTML = intro.map(inline).join(" ");
    log.innerHTML = html;
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }
  fetch("CHANGELOG.md", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(render)
    .catch(e => {
      log.innerHTML = '<p class="msg">The changelog couldn’t be loaded ({ERR}). <a href="https://github.com/gp-songtools/earprint/blob/main/CHANGELOG.md">View it on GitHub</a>.</p>'.replace("{ERR}", esc(String(e.message || e)));
    });
})();
</script>

</html>
